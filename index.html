<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>Torneos Adila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --verde: #1E4A34;
    --verde-claro: #2F6B4A;
    --verde-oscuro: #12301F;
    --tiza: #F7F5EF;
    --dorado: #C9972E;
    --dorado-claro: #E4C77A;
    --tinta: #182019;
    --rojo: #A8402E;
    --linea: #D8D3C4;
    --blanco: #FFFFFF;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--tiza); color:var(--tinta);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:18px; line-height:1.45; min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Anton','Impact',sans-serif; font-weight:400; letter-spacing:0.02em;
    text-transform:uppercase; color:var(--verde-oscuro);
  }
  button, input, select{ font-family:inherit; font-size:1rem; }
  button{ cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{ outline:3px solid var(--dorado); outline-offset:2px; }
  .wrap{ max-width:820px; margin:0 auto; padding:0 16px 56px; }

  /* ---------- Topbar ---------- */
  .topbar{
    background:linear-gradient(135deg,var(--verde) 0%,var(--verde-oscuro) 100%);
    color:var(--tiza); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.18); position:sticky; top:0; z-index:50;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .back-btn{
    background:rgba(255,255,255,.14); border:none; color:var(--tiza); width:44px; height:44px; border-radius:12px;
    font-size:1.3rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .topbar-title{ font-family:'Anton',sans-serif; font-size:1.15rem; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .admin-pill{
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.14); border:none; color:var(--tiza);
    padding:10px 14px; border-radius:999px; font-weight:700; font-size:.95rem; white-space:nowrap;
  }
  .admin-pill.on{ background:var(--dorado); color:var(--verde-oscuro); }

  /* ---------- Hero / Home ---------- */
  .hero{
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 40px, transparent 40px 80px),
      linear-gradient(160deg,var(--verde) 0%, var(--verde-oscuro) 100%);
    color:var(--tiza); padding:40px 16px 46px; text-align:center;
  }
  .hero h1{ color:var(--tiza); font-size:2.4rem; margin:0 0 6px; }
  .hero p{ color:var(--dorado-claro); font-size:1.1rem; margin:0; font-weight:700; }
  .torneo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:820px; margin:-26px auto 0; padding:0 16px; position:relative; }
  @media (max-width:560px){ .torneo-grid{ grid-template-columns:1fr; } }
  .torneo-card{
    background:var(--blanco); border:none; border-radius:18px; padding:26px 16px; box-shadow:0 10px 24px rgba(18,48,31,.18);
    display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; transition:transform .15s;
  }
  .torneo-card:active{ transform:scale(.98); }
  .crest-slot{
    width:74px; height:74px; border-radius:50%; background:var(--tiza); border:3px solid var(--dorado);
    display:flex; align-items:center; justify-content:center; font-size:2rem; overflow:hidden;
  }
  .crest-slot img{ width:100%; height:100%; object-fit:cover; }
  .torneo-card-name{ font-family:'Anton',sans-serif; font-size:1.25rem; color:var(--verde-oscuro); }
  .torneo-card-sub{ color:#6b6659; font-size:.92rem; font-weight:600; margin-top:-6px; }

  .banner{
    background:#FFF3D1; border:2px solid var(--dorado); border-radius:14px; padding:14px 16px; margin:18px 0 4px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-weight:700; color:#5c4410;
  }
  .ed-chip{
    display:inline-block; background:var(--verde); color:var(--tiza); padding:7px 14px; border-radius:999px;
    font-weight:700; font-size:.9rem; margin-bottom:4px;
  }
  .ed-chip.fin{ background:var(--dorado); color:var(--verde-oscuro); }

  /* ---------- Campeones enmarcados ---------- */
  .champ-title{ text-align:center; margin:30px 0 6px; font-size:1.5rem; }
  .champ-grid{ display:grid; grid-template-columns:1fr 1fr; gap:26px; margin:26px 0 10px; }
  @media (max-width:560px){ .champ-grid{ grid-template-columns:1fr; } }
  .champ-frame{
    position:relative; background:linear-gradient(160deg,#FFF9E6,#F6E7B4); border:3px solid var(--dorado);
    border-radius:18px; padding:34px 16px 22px; text-align:center; margin:6px 8px;
    box-shadow:0 0 0 6px #FFF9E6, 0 0 0 9px var(--dorado), 0 12px 26px rgba(18,48,31,.22);
  }
  .champ-ribbon{
    position:absolute; top:-17px; left:50%; transform:translateX(-50%); background:var(--verde-oscuro); color:var(--dorado-claro);
    font-family:'Anton',sans-serif; padding:7px 20px; border-radius:999px; letter-spacing:.1em; white-space:nowrap; font-size:1rem;
    border:2px solid var(--dorado);
  }
  .champ-crest{
    width:96px; height:96px; border-radius:50%; margin:8px auto 12px; border:4px solid var(--dorado); background:var(--tiza);
    overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:2.6rem;
  }
  .champ-crest img{ width:100%; height:100%; object-fit:cover; }
  .champ-team{ font-family:'Anton',sans-serif; font-size:1.45rem; color:var(--verde-oscuro); text-transform:uppercase; letter-spacing:.02em; }
  .champ-torneo{ font-weight:800; color:#7a5a12; margin-top:6px; font-size:.95rem; }
  .hist-card{ background:var(--blanco); border:2px solid var(--linea); border-radius:18px; padding:20px 16px 18px; margin-bottom:20px; }
  .hist-card h3{ margin:0 0 4px; font-size:1.35rem; }
  .hist-sub{ color:#6b6659; font-weight:600; font-size:.92rem; }

  /* ---------- Generic ---------- */
  .section{ padding:24px 0 4px; }
  .section-title{ font-size:1.3rem; margin:0 0 14px; }
  .zona-grid{ display:grid; gap:14px; }
  .zona-btn{
    background:var(--blanco); border:2px solid var(--linea); border-radius:14px; padding:18px 20px; text-align:left;
    display:flex; align-items:center; justify-content:space-between; font-weight:700; color:var(--verde-oscuro); font-size:1.1rem;
  }
  .zona-btn .tag{ background:var(--verde); color:var(--tiza); font-size:.8rem; padding:5px 10px; border-radius:999px; font-weight:700; }

  .tabs{ display:flex; gap:8px; margin:12px 0 18px; flex-wrap:wrap; }
  .tab-btn{
    flex:1; min-width:120px; background:var(--blanco); border:2px solid var(--linea); color:var(--verde-oscuro);
    padding:12px 10px; border-radius:12px; font-weight:800; font-size:.95rem;
  }
  .tab-btn.active{ background:var(--verde); border-color:var(--verde); color:var(--tiza); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 18px;
    border-radius:12px; border:2px solid transparent; font-weight:800; font-size:1rem; text-align:center;
  }
  .btn-primary{ background:var(--verde); color:var(--tiza); }
  .btn-gold{ background:var(--dorado); color:var(--verde-oscuro); }
  .btn-outline{ background:var(--blanco); color:var(--verde-oscuro); border-color:var(--verde); }
  .btn-danger{ background:var(--blanco); color:var(--rojo); border-color:var(--rojo); }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .home-actions{ display:grid; gap:12px; margin-top:28px; }

  /* ---------- Tabla ---------- */
  .table-scroll{ overflow-x:auto; border-radius:14px; box-shadow:0 4px 14px rgba(18,48,31,.1); }
  table.tabla{ border-collapse:collapse; width:100%; min-width:600px; background:var(--blanco); }
  table.tabla th, table.tabla td{ padding:11px 10px; text-align:center; border-bottom:1px solid var(--linea); white-space:nowrap; }
  table.tabla thead th{ background:var(--verde); color:var(--tiza); font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; }
  table.tabla tbody tr:nth-child(odd){ background:#FBFAF6; }
  table.tabla td.equipo-cell{ text-align:left; font-weight:700; position:sticky; left:0; background:inherit; min-width:170px; }
  table.tabla thead th.equipo-cell{ position:sticky; left:0; z-index:2; text-align:left; }
  .equipo-cell-inner{ display:flex; align-items:center; gap:9px; }
  .crest-sm{ width:28px; height:28px; border-radius:50%; object-fit:cover; background:var(--tiza); border:1px solid var(--linea); flex-shrink:0; }
  .crest-sm-ph{ width:28px; height:28px; border-radius:50%; background:var(--tiza); border:1px solid var(--linea); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.8rem; }
  table.tabla td.pts-cell{ font-weight:800; color:var(--verde-oscuro); background:#FBF3DE; }
  table.tabla tbody tr:first-child td{ background:#FDF6E3; }
  .empty-note{ color:#7a7566; font-size:.95rem; padding:14px 2px; }
  .download-row{ display:flex; gap:10px; margin:16px 0 14px; flex-wrap:wrap; }

  .fecha-row{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px; }
  .fecha-chip{
    flex-shrink:0; background:var(--blanco); border:2px solid var(--linea); color:var(--verde-oscuro);
    padding:10px 16px; border-radius:999px; font-weight:800; white-space:nowrap;
  }
  .fecha-chip.active{ background:var(--dorado); border-color:var(--dorado); color:var(--verde-oscuro); }

  /* ---------- Partidos ---------- */
  .match-card{ background:var(--verde-oscuro); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 6px 16px rgba(18,48,31,.22); color:var(--tiza); }
  .match-teams{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
  .match-team{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; min-width:0; }
  .match-team .crest-md{ width:52px; height:52px; border-radius:50%; object-fit:cover; background:var(--tiza); border:2px solid var(--dorado); }
  .match-team .crest-md-ph{ width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.1); border:2px solid var(--dorado); display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
  .match-team-name{ font-weight:800; font-size:.92rem; }
  .score-box{ display:flex; align-items:center; gap:10px; justify-content:center; }
  .score-num{ font-family:'Anton',sans-serif; font-size:2.1rem; background:var(--tinta); color:var(--dorado-claro); border-radius:8px; padding:2px 6px; min-width:46px; text-align:center; }
  .vs-label{ font-family:'Anton',sans-serif; color:var(--dorado); font-size:1rem; }
  .pendiente-label{ font-family:'Anton',sans-serif; color:rgba(255,255,255,.55); font-size:.95rem; letter-spacing:.05em; }
  .score-editor{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:4px; }
  .step-btn{ width:38px; height:38px; border-radius:10px; border:none; background:rgba(255,255,255,.14); color:var(--tiza); font-size:1.3rem; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .step-input{ width:52px; text-align:center; border:none; border-radius:8px; height:38px; font-size:1.2rem; font-weight:800; }
  .match-admin-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:10px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,.15); padding-top:12px; }
  .jugado-check{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:.9rem; }
  .jugado-check input{ width:22px; height:22px; }
  .libre-card{ background:var(--dorado); color:var(--verde-oscuro); border-radius:16px; padding:16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; font-weight:800; }

  /* ---------- Forms ---------- */
  .card{ background:var(--blanco); border:2px solid var(--linea); border-radius:16px; padding:18px; margin-bottom:16px; }
  .card-admin{ border-color:var(--dorado); }
  .card-title{ font-weight:800; font-size:1.02rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; color:var(--verde-oscuro); }
  .card p.help{ margin:0 0 14px; color:#5d5a4d; font-size:.95rem; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-weight:700; margin-bottom:6px; font-size:.92rem; color:#4a473d; }
  .field input[type=text], .field input[type=date], .field select, .field input[type=number]{
    width:100%; padding:12px; border-radius:10px; border:2px solid var(--linea); background:var(--tiza); min-height:48px;
  }
  .file-btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--tiza); border:2px dashed var(--verde);
    padding:12px 16px; border-radius:10px; font-weight:700; color:var(--verde-oscuro); width:100%; justify-content:center; cursor:pointer;
  }
  .file-btn input{ display:none; }
  .equipo-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--linea); flex-wrap:wrap; }
  .equipo-row:last-child{ border-bottom:none; }
  .equipo-row .nombre{ flex:1; font-weight:700; min-width:120px; }
  .equipo-row .crest-md-sm{ width:40px; height:40px; border-radius:50%; object-fit:cover; background:var(--tiza); border:1px solid var(--linea); flex-shrink:0; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--verde-oscuro); color:var(--tiza);
    padding:14px 22px; border-radius:12px; font-weight:800; box-shadow:0 8px 20px rgba(0,0,0,.3); z-index:200; max-width:90%; text-align:center;
  }
  .loader-note{ text-align:center; padding:40px 10px; color:#6b6659; font-weight:700; }

  /* export */
  #exportHolder{ position:fixed; left:-9999px; top:0; }
  .export-card{ width:720px; background:var(--tiza); font-family:'Inter',sans-serif; padding:28px; }
  .export-header{ display:flex; align-items:center; gap:16px; margin-bottom:18px; border-bottom:4px solid var(--dorado); padding-bottom:14px; }
  .export-logo{ width:64px; height:64px; border-radius:50%; object-fit:cover; border:3px solid var(--verde); }
  .export-torneo{ font-family:'Anton',sans-serif; font-size:1.5rem; color:var(--verde-oscuro); text-transform:uppercase; }
  .export-zona{ font-weight:700; color:var(--dorado); }
  table.export-table{ width:100%; border-collapse:collapse; }
  table.export-table th{ background:var(--verde); color:var(--tiza); padding:10px 8px; font-size:.78rem; text-transform:uppercase; }
  table.export-table td{ padding:9px 8px; text-align:center; border-bottom:1px solid var(--linea); font-weight:600; }
  table.export-table tr.lider td{ background:#FDF0C6; }
  .export-equipo{ display:flex; align-items:center; gap:8px; text-align:left; font-weight:800; }
  .export-equipo img{ width:26px; height:26px; border-radius:50%; object-fit:cover; }
  td.pts{ font-weight:800; color:var(--verde-oscuro); }
  .export-footer{ text-align:center; margin-top:16px; color:#8a8574; font-size:.85rem; font-weight:600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="exportHolder"></div>

<script>
/* =======================================================================
   CONFIGURACIÓN
   ======================================================================= */
const TORNEOS = {
  veteranos50: {
    id:'veteranos50', nombre:'Torneo Veteranos +50',
    zonas:[ { id:'unica', nombre:'Zona Única' } ]
  },
  masCuarenta: {
    id:'masCuarenta', nombre:'Torneo +40',
    zonas:[ { id:'a', nombre:'Zona A' }, { id:'b', nombre:'Zona B' } ]
  }
};
const ADMIN_PASSWORD = 'adila2026';

const firebaseConfig = {
  apiKey: "AIzaSyAULw31PlNW07zg4G8XhVWlTngSiTjdXVQ",
  authDomain: "torneosadila2.firebaseapp.com",
  projectId: "torneosadila2",
  storageBucket: "torneosadila2.firebasestorage.app",
  messagingSenderId: "997767741356",
  appId: "1:997767741356:web:79cb30fe0721be6e370409"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLECCION = 'torneosAdila';

/* =======================================================================
   ESTADO
   ======================================================================= */
const state = {
  view:'home',            // home | zonaSelect | torneo | historial | adminTorneo
  torneoId:null, zonaId:null,
  subview:'tabla', fechaActual:null,
  admin:false,
  cache:{},               // datos por edición/torneo/zona
  logos:{},
  ediciones:[],           // [{id, fechaInicio, cerrada}]
  campeones:{},           // campeones[edicionId] = { torneoId: {...} }
  edicionId:null,         // edición que se está viendo
  cargando:true, errorCarga:false, loadingZona:false,
  toast:null
};

/* =======================================================================
   UTILIDADES
   ======================================================================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  state.toast = msg; renderToast();
  setTimeout(()=>{ state.toast=null; renderToast(); }, 1800);
}
function renderToast(){
  const old = document.querySelector('.toast'); if(old) old.remove();
  if(state.toast){
    const d = document.createElement('div'); d.className='toast'; d.textContent = state.toast;
    document.body.appendChild(d);
  }
}
function fmtFecha(iso){
  if(!iso) return '';
  const p = iso.split('-'); if(p.length!==3) return iso;
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function hoyISO(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${dd}`;
}
function resizeImageToDataURL(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=>reject(new Error('imagen invalida'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('lectura fallida'));
    reader.readAsDataURL(file);
  });
}

/* ---- Ediciones (cada torneo nuevo es una "edición" con nombre = fecha de inicio) ---- */
function ultimaEdicion(){ return state.ediciones[state.ediciones.length-1]; }
function edicionVista(){ return state.ediciones.find(e=>e.id===state.edicionId) || ultimaEdicion(); }
function nombreEdicion(ed){
  if(!ed) return '';
  if(ed.fechaInicio) return 'Torneo ' + fmtFecha(ed.fechaInicio);
  return ed.cerrada ? 'Torneo anterior' : 'Torneo en curso';
}
function puedeEditar(){
  const ed = edicionVista();
  return state.admin && ed && !ed.cerrada;
}

/* =======================================================================
   ALMACENAMIENTO (Firebase)
   ======================================================================= */
async function storageGet(key){
  const doc = await db.collection(COLECCION).doc(key).get();   // si falla, lanza error
  return doc.exists ? doc.data().value : null;
}
async function storageSet(key, value){
  try{
    await db.collection(COLECCION).doc(key).set({ value });
    return true;
  }catch(e){
    console.error('Error guardando', key, e);
    alert('No se pudo guardar. Revisá tu conexión a internet e intentá de nuevo.');
    return false;
  }
}
/* La primera edición usa las claves originales (así no se pierde lo ya cargado). */
function sk(prefix, edId, t, z){
  return edId==='inicial' ? `${prefix}-${t}-${z}` : `${prefix}-${edId}-${t}-${z}`;
}
async function getEquipos(edId,t,z){ const v = await storageGet(sk('equipos',edId,t,z)); return v ? JSON.parse(v) : []; }
async function saveEquipos(edId,t,z,arr){ return storageSet(sk('equipos',edId,t,z), JSON.stringify(arr)); }
async function getFechas(edId,t,z){ const v = await storageGet(sk('fechas',edId,t,z)); return v ? JSON.parse(v) : []; }
async function saveFechas(edId,t,z,arr){ return storageSet(sk('fechas',edId,t,z), JSON.stringify(arr)); }
async function saveEdiciones(){ return storageSet('ediciones', JSON.stringify(state.ediciones)); }
async function saveCampeones(edId){ return storageSet('campeones-'+edId, JSON.stringify(state.campeones[edId]||{})); }
async function getLogo(torneoId){ return await storageGet('logo-'+torneoId); }

function ckey(edId,t,z){ return edId+'|'+t+'|'+z; }
async function ensureZonaData(edId,t,z){
  const key = ckey(edId,t,z);
  if(state.cache[key]) return true;
  state.loadingZona = true; render();
  try{
    const [equipos, fechas] = await Promise.all([getEquipos(edId,t,z), getFechas(edId,t,z)]);
    state.cache[key] = { equipos, fechas };
    state.loadingZona = false;
    return true;
  }catch(e){
    state.loadingZona = false;
    alert('No se pudieron cargar los datos. Revisá tu conexión a internet.');
    return false;
  }
}
function getCache(){ return state.cache[ckey(state.edicionId, state.torneoId, state.zonaId)]; }

/* =======================================================================
   TABLA DE POSICIONES
   ======================================================================= */
function computeTabla(equipos, fechas){
  const stats = {};
  equipos.forEach(e=>{ stats[e.id] = { id:e.id, nombre:e.nombre, escudo:e.escudo||null, pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0 }; });
  fechas.forEach(f=>{
    (f.partidos||[]).forEach(p=>{
      if(!p.jugado) return;
      const l = stats[p.localId], v = stats[p.visitanteId];
      if(!l || !v) return;
      const gl = Number(p.golesLocal)||0, gv = Number(p.golesVisitante)||0;
      l.pj++; v.pj++; l.gf+=gl; l.gc+=gv; v.gf+=gv; v.gc+=gl;
      if(gl>gv){ l.pg++; l.pts+=3; v.pp++; }
      else if(gl<gv){ v.pg++; v.pts+=3; l.pp++; }
      else { l.pe++; v.pe++; l.pts+=1; v.pts+=1; }
    });
  });
  const arr = Object.values(stats);
  arr.sort((a,b)=> b.pts-a.pts || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf || a.nombre.localeCompare(b.nombre,'es'));
  return arr;
}

/* =======================================================================
   FECHAS Y PARTIDOS  (el equipo sin rival queda LIBRE automáticamente)
   ======================================================================= */
function nuevaFecha(){
  const c = getCache();
  const numero = c.fechas.reduce((m,f)=>Math.max(m,f.numero),0)+1;
  c.fechas.push({ numero, partidos:[] });
  saveFechas(state.edicionId, state.torneoId, state.zonaId, c.fechas);
  state.fechaActual = numero;
  render();
}
function irAFecha(n){ state.fechaActual = n; render(); }
function equiposConRival(fecha){
  const usados = new Set();
  (fecha.partidos||[]).forEach(p=>{ usados.add(p.localId); usados.add(p.visitanteId); });
  return usados;
}
function equiposDisponiblesEnFecha(fecha){
  const usados = equiposConRival(fecha);
  return getCache().equipos.filter(e=>!usados.has(e.id));
}
function equiposLibres(fecha){
  if(!(fecha.partidos||[]).length) return [];
  const usados = equiposConRival(fecha);
  return getCache().equipos.filter(e=>!usados.has(e.id));
}
async function agregarPartido(){
  const c = getCache();
  const fecha = c.fechas.find(f=>f.numero===state.fechaActual);
  if(!fecha) return;
  const localId = document.getElementById('selLocal').value;
  const visitanteId = document.getElementById('selVisitante').value;
  if(!localId || !visitanteId){ alert('Elegí ambos equipos.'); return; }
  if(localId===visitanteId){ alert('Un equipo no puede jugar contra sí mismo.'); return; }
  fecha.partidos = fecha.partidos || [];
  fecha.partidos.push({ id:uid(), localId, visitanteId, golesLocal:0, golesVisitante:0, jugado:false });
  if(await saveFechas(state.edicionId, state.torneoId, state.zonaId, c.fechas)){ render(); showToast('Partido agregado ✔'); }
}
async function eliminarPartido(partidoId){
  if(!confirm('¿Eliminar este partido?')) return;
  const c = getCache();
  const fecha = c.fechas.find(f=>f.numero===state.fechaActual);
  fecha.partidos = fecha.partidos.filter(p=>p.id!==partidoId);
  await saveFechas(state.edicionId, state.torneoId, state.zonaId, c.fechas);
  render();
}
async function guardarResultado(partidoId){
  const c = getCache();
  const fecha = c.fechas.find(f=>f.numero===state.fechaActual);
  const p = fecha.partidos.find(x=>x.id===partidoId);
  p.golesLocal = Math.max(0, parseInt(document.getElementById('gl-'+partidoId).value,10)||0);
  p.golesVisitante = Math.max(0, parseInt(document.getElementById('gv-'+partidoId).value,10)||0);
  p.jugado = document.getElementById('jg-'+partidoId).checked;
  if(await saveFechas(state.edicionId, state.torneoId, state.zonaId, c.fechas)){ render(); showToast('Resultado guardado ✔'); }
}
function stepScore(partidoId, campo, delta){
  const el = document.getElementById(campo+'-'+partidoId);
  el.value = Math.max(0, (parseInt(el.value,10)||0)+delta);
}
async function eliminarFecha(){
  if(!confirm('¿Eliminar esta fecha completa junto con sus partidos cargados?')) return;
  const c = getCache();
  c.fechas = c.fechas.filter(f=>f.numero!==state.fechaActual);
  await saveFechas(state.edicionId, state.torneoId, state.zonaId, c.fechas);

}

/* =======================================================================
   TERMINAR TORNEO / CREAR TORNEO NUEVO
   ======================================================================= */
async function guardarFechaInicio(){
  const v = document.getElementById('fechaInicioInput').value;
  if(!v){ alert('Elegí la fecha en que empezó el torneo.'); return; }
  const ed = ultimaEdicion();
  ed.fechaInicio = v;
  if(await saveEdiciones()){ render(); showToast('Fecha guardada ✔'); }
}
async function terminarTorneo(){
  const ed = ultimaEdicion();
  if(!ed.fechaInicio){ alert('Primero guardá la fecha en que empezó este torneo (primer recuadro). Con esa fecha se va a llamar el torneo en el historial.'); return; }
  const campeones = {};
  Object.values(TORNEOS).forEach(t=>{
    const sel = document.getElementById('camp-'+t.id);
    if(!sel || !sel.value) return;
    const [zId, eId] = sel.value.split('|');
    const c = state.cache[ckey(ed.id,t.id,zId)];
    const eq = c && c.equipos.find(e=>e.id===eId);
    const zona = t.zonas.find(z=>z.id===zId);
    if(eq) campeones[t.id] = { equipoId:eq.id, nombre:eq.nombre, escudo:eq.escudo||null, zonaId:zId, zonaNombre:zona.nombre };
  });
  if(!Object.keys(campeones).length && !confirm('No elegiste ningún campeón. ¿Querés terminar el torneo igual?')) return;
  if(!confirm('¿Terminar el torneo? Después no se van a poder cargar más resultados (solo verlos).')) return;
  ed.cerrada = true;
  state.campeones[ed.id] = campeones;
  const ok1 = await saveCampeones(ed.id);
  const ok2 = await saveEdiciones();
  if(!ok1 || !ok2){ ed.cerrada=false; render(); return; }
  render(); showToast('Torneo terminado ✔ Campeones guardados');
}
async function reabrirTorneo(){
  if(!confirm('¿Volver a abrir el torneo para corregir datos? Se van a borrar los campeones guardados y vas a tener que elegirlos de nuevo al terminarlo.')) return;
  const ed = ultimaEdicion();
  ed.cerrada = false;
  state.campeones[ed.id] = {};
  await saveCampeones(ed.id);
  await saveEdiciones();
  render(); showToast('Torneo reabierto');
}
async function crearNuevoTorneo(){
  const fecha = document.getElementById('nuevaFechaInicio').value;
  if(!fecha){ alert('Elegí la fecha en que empieza el nuevo torneo.'); return; }
  if(!confirm('¿Crear el torneo nuevo con fecha de inicio '+fmtFecha(fecha)+'? Se van a copiar los equipos del torneo anterior.')) return;
  const previo = ultimaEdicion();
  const nuevo = { id:uid(), fechaInicio:fecha, cerrada:false };
  showToast('Creando torneo nuevo…');
  try{
    for(const t of Object.values(TORNEOS)){
      for(const z of t.zonas){
        const key = ckey(previo.id,t.id,z.id);
        const equipos = state.cache[key] ? state.cache[key].equipos : await getEquipos(previo.id,t.id,z.id);
        const copia = equipos.map(e=>({ id:e.id, nombre:e.nombre, escudo:e.escudo||null }));
        const ok1 = await saveEquipos(nuevo.id,t.id,z.id,copia);
        const ok2 = await saveFechas(nuevo.id,t.id,z.id,[]);
        if(!ok1 || !ok2) return;
        state.cache[ckey(nuevo.id,t.id,z.id)] = { equipos:copia, fechas:[] };
      }
    }
  }catch(e){ alert('No se pudo crear el torneo. Revisá tu conexión e intentá de nuevo.'); return; }
  state.ediciones.push(nuevo);
  if(!(await saveEdiciones())){ state.ediciones.pop(); return; }
  state.edicionId = nuevo.id;
  state.view = 'home';
  render(); window.scrollTo(0,0);
  showToast('Torneo nuevo creado ✔ Revisá los equipos en cada zona');
}

function buildExportHTML(torneo, zona, tabla){
  const logo = state.logos[torneo.id];
  const fecha = new Date().toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
  const filas = tabla.map((e,i)=>`
    <tr class="${i===0?'lider':''}">
      <td>${i+1}</td>
      <td class="export-equipo">${e.escudo?`<img src="${e.escudo}">`:''}<span>${escapeHtml(e.nombre)}</span></td>
      <td>${e.pj}</td><td>${e.pg}</td><td>${e.pe}</td><td>${e.pp}</td>
      <td>${e.gf}</td><td>${e.gc}</td><td>${e.gf-e.gc}</td>
      <td class="pts">${e.pts}</td>
    </tr>`).join('');
  return `<div class="export-card">
    <div class="export-header">
      ${logo?`<img class="export-logo" src="${logo}">`:''}
      <div>
        <div class="export-torneo">${escapeHtml(torneo.nombre)}</div>
        <div class="export-zona">${escapeHtml(zona.nombre)} · ${escapeHtml(nombreEdicion(edicionVista()))}</div>
      </div>
    </div>
    <table class="export-table">
      <thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DIF</th><th>PTS</th></tr></thead>
      <tbody>${filas || '<tr><td colspan="10">Sin equipos cargados</td></tr>'}</tbody>
    </table>
    <div class="export-footer">Actualizado el ${fecha} · Torneos Adila</div>
  </div>`;
}
async function descargarTabla(tipo){
  if(typeof html2canvas==='undefined'){ alert('No se pudo cargar la herramienta de descarga. Revisá tu conexión e intentá de nuevo.'); return; }
  const torneo = TORNEOS[state.torneoId];
  const zona = torneo.zonas.find(z=>z.id===state.zonaId);
  const c = getCache();
  const tabla = computeTabla(c.equipos, c.fechas);
  const holder = document.getElementById('exportHolder');
  holder.innerHTML = buildExportHTML(torneo, zona, tabla);
  await new Promise(r=>setTimeout(r,120));
  try{
    const canvas = await html2canvas(holder.firstElementChild, { scale:2, backgroundColor:'#F7F5EF' });
    const nombre = `tabla-${torneo.id}-${zona.id}`;
    if(tipo==='png'){
      const link = document.createElement('a');
      link.download = nombre+'.png'; link.href = canvas.toDataURL('image/png'); link.click();
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
      const imgW = pdf.internal.pageSize.getWidth()-40;
      const imgH = canvas.height*(imgW/canvas.width);
      pdf.addImage(canvas.toDataURL('image/png'),'PNG',20,20,imgW,imgH);
      pdf.save(nombre+'.pdf');
    }
  }catch(err){
    alert('No se pudo generar el archivo. Intentá de nuevo.');
  } finally { holder.innerHTML=''; }
}

    const c = state.cache[ckey(ed.id,torneo.id,z.id)]; if(!c) return;
    const tabla = computeTabla(c.equipos, c.fechas);
    const opts = tabla.map((e,i)=>`<option value="${z.id}|${e.id}" ${unaZona && i===0 && e.pj>0 ? 'selected':''}>${i+1}° ${escapeHtml(e.nombre)} (${e.pts} pts)</option>`).join('');
    html += unaZona ? opts : `<optgroup label="${escapeHtml(z.nombre)}">${opts}</optgroup>`;
  });
  return html;
}
function renderAdminTorneo(){
  const ed = ultimaEdicion();
  let cuerpo = '';
  if(!ed.cerrada){
    cuerpo = `
      <div class="card card-admin">
        <div class="card-title">📅 Fecha en que empezó este torneo</div>
        <p class="help">Con esta fecha se llama el torneo en el historial.</p>
        <div class="field"><input type="date" id="fechaInicioInput" value="${ed.fechaInicio||''}"></div>
        <button class="btn btn-primary btn-block" onclick="guardarFechaInicio()">Guardar fecha</button>
      </div>
      <div class="card card-admin">
        <div class="card-title">🏁 Terminar el torneo y guardar campeones</div>
        <p class="help">Elegí quién fue el campeón de cada torneo. Si en el +40 hubo final, elegí al ganador de la final. Después de terminar, ya no se pueden cargar resultados.</p>
        ${Object.values(TORNEOS).map(t=>`
          <div class="field">
            <label for="camp-${t.id}">Campeón del ${escapeHtml(t.nombre)}</label>
            <select id="camp-${t.id}">${opcionesCampeon(ed,t)}</select>
          </div>`).join('')}
        <button class="btn btn-gold btn-block" onclick="terminarTorneo()">🏆 Terminar torneo y guardar campeones</button>
      </div>`;
  } else {
    cuerpo = `
      <div class="card">
        <div class="card-title">✅ ${escapeHtml(nombreEdicion(ed))} está terminado</div>
        ${renderCampeones(ed)}
        <button class="btn btn-danger btn-block" onclick="reabrirTorneo()">↩️ Volver a abrir este torneo (para corregir algo)</button>
      </div>
      <div class="card card-admin">
        <div class="card-title">🆕 Crear torneo nuevo</div>
        <p class="help">Se guardan los equipos y escudos del torneo anterior. Después, dentro de cada zona, en la pestaña "Equipos" podés agregar equipos nuevos o borrar los que no sigan.</p>
        <div class="field">
          <label for="nuevaFechaInicio">¿Qué día empieza el torneo nuevo?</label>
          <input type="date" id="nuevaFechaInicio" value="${hoyISO()}">
        </div>
        <button class="btn btn-primary btn-block" onclick="crearNuevoTorneo()">Crear torneo nuevo</button>
      </div>`;
  }
  document.getElementById('app').innerHTML = `
    ${renderTopbar('Administrar torneo', true, 'goHome()')}
    <div class="wrap section">
      <span class="ed-chip ${ed.cerrada?'fin':''}">${escapeHtml(nombreEdicion(ed))}${ed.cerrada?' · Finalizado':' · En curso'}</span>
      ${cuerpo}
    </div>`;
}

/* =======================================================================
   RENDER: ZONAS
   ======================================================================= */
function renderZonaSelect(){
  const torneo = TORNEOS[state.torneoId];
  document.getElementById('app').innerHTML = `
    ${renderTopbar(torneo.nombre, true, 'goHome()')}
    <div class="wrap section">
      <span class="ed-chip ${edicionVista().cerrada?'fin':''}">${escapeHtml(nombreEdicion(edicionVista()))}</span>
      <h2 class="section-title">Elegí la zona</h2>
      <div class="zona-grid">
        ${torneo.zonas.map(z=>`
          <button class="zona-btn" onclick="enterZona('${torneo.id}','${z.id}')"><span>${escapeHtml(z.nombre)}</span><span class="tag">Ver →</span></button>
        `).join('')}
      </div>
    </div>`;
}

/* =======================================================================
   RENDER: TORNEO / ZONA
   ======================================================================= */
function renderTorneoView(){
  const torneo = TORNEOS[state.torneoId];
  const zona = torneo.zonas.find(z=>z.id===state.zonaId);
  const backAction = torneo.zonas.length>1 ? `goTorneo('${torneo.id}')` : 'goHome()';
  const titulo = torneo.zonas.length>1 ? `${torneo.nombre} · ${zona.nombre}` : torneo.nombre;
  const app = document.getElementById('app');

  if(state.loadingZona || !getCache()){
    app.innerHTML = `${renderTopbar(titulo, true, backAction)}<div class="wrap"><p class="loader-note">Cargando datos…</p></div>`;
    return;
  }
  const ed = edicionVista();
  const editar = puedeEditar();
  if(state.subview==='equipos' && !editar) state.subview='tabla';

  const tabs = `
    <div class="tabs">
      <button class="tab-btn ${state.subview==='tabla'?'active':''}" onclick="setSubview('tabla')">📊 Tabla</button>
      <button class="tab-btn ${state.subview==='fixture'?'active':''}" onclick="setSubview('fixture')">📅 Fechas y resultados</button>
      ${editar ? `<button class="tab-btn ${state.subview==='equipos'?'active':''}" onclick="setSubview('equipos')">🛡️ Equipos</button>` : ''}
    </div>`;

  let body = '';
  if(state.subview==='tabla') body = renderTablaHTML();
  else if(state.subview==='fixture') body = renderFixtureHTML();
  else if(state.subview==='equipos') body = renderEquiposHTML();

  app.innerHTML = `
    ${renderTopbar(titulo, true, backAction)}
    <div class="wrap section">
      <span class="ed-chip ${ed.cerrada?'fin':''}">${escapeHtml(nombreEdicion(ed))}${ed.cerrada?' · Finalizado (solo lectura)':''}</span>
      ${tabs}
      ${body}
    </div>`;
}

function renderTablaHTML(){
  const c = getCache();
  const editar = puedeEditar();
  const tabla = computeTabla(c.equipos, c.fechas);
  if(!c.equipos.length){
    return `<p class="empty-note">Todavía no hay equipos cargados en esta zona.${editar?' Andá a la pestaña "Equipos" para agregarlos.':''}</p>`;
  }
  const filas = tabla.map((e,i)=>`
    <tr>
      <td>${i+1}</td>
      <td class="equipo-cell"><div class="equipo-cell-inner">
        ${e.escudo?`<img class="crest-sm" src="${e.escudo}" alt="">`:`<div class="crest-sm-ph">🛡️</div>`}
        <span>${escapeHtml(e.nombre)}</span>
      </div></td>
      <td>${e.pj}</td><td>${e.pg}</td><td>${e.pe}</td><td>${e.pp}</td>
      <td>${e.gf}</td><td>${e.gc}</td><td>${e.gf-e.gc}</td>
      <td class="pts-cell">${e.pts}</td>
    </tr>`).join('');
  return `
    <div class="download-row">
      <button class="btn btn-gold" onclick="descargarTabla('png')">🖼️ Descargar imagen</button>
      <button class="btn btn-outline" onclick="descargarTabla('pdf')">📄 Descargar PDF</button>
    </div>
    <div class="table-scroll">
      <table class="tabla">
        <thead><tr>
          <th>#</th><th class="equipo-cell">Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DIF</th><th>PTS</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
}

function renderFixtureHTML(){
  const c = getCache();
  const editar = puedeEditar();
  if(!c.equipos.length){
    return `<p class="empty-note">Primero cargá los equipos de la zona${editar?' en la pestaña "Equipos"':''}.</p>`;
  }
  const chips = c.fechas.slice().sort((a,b)=>a.numero-b.numero).map(f=>`
    <button class="fecha-chip ${f.numero===state.fechaActual?'active':''}" onclick="irAFecha(${f.numero})">Fecha ${f.numero}</button>`).join('');

  let contenido = '';
  const fecha = c.fechas.find(f=>f.numero===state.fechaActual);

  if(!fecha){
    contenido = `<p class="empty-note">${editar ? 'Todavía no hay fechas creadas. Usá el botón "Nueva fecha" para empezar a cargar resultados.' : 'Todavía no hay fechas cargadas.'}</p>`;
  } else {
    const partidosHTML = (fecha.partidos||[]).map(p=>renderMatchCard(p, c, editar)).join('');
    const libreHTML = equiposLibres(fecha).map(e=>`
      <div class="libre-card">
        ${e.escudo?`<img class="crest-sm" src="${e.escudo}" alt="" style="width:40px;height:40px;">`:'🛌'}
        <span>${escapeHtml(e.nombre)}: fecha libre (no juega ni suma puntos)</span>
      </div>`).join('');

    contenido = `${libreHTML}${partidosHTML || `<p class="empty-note">Todavía no hay partidos cargados en esta fecha.</p>`}`;

    if(editar){
      const disp = equiposDisponiblesEnFecha(fecha);
      const form = disp.length>=2 ? `
        <div class="card card-admin">
          <div class="card-title">⚽ Agregar partido a la Fecha ${fecha.numero}</div>
          <p class="help">Los equipos que no tengan rival en esta fecha quedan <b>libres automáticamente</b>.</p>
          <div class="field">
            <label for="selLocal">Equipo local</label>
            <select id="selLocal"><option value="">Elegí un equipo</option>${disp.map(e=>`<option value="${e.id}">${escapeHtml(e.nombre)}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label for="selVisitante">Equipo visitante</label>
            <select id="selVisitante"><option value="">Elegí un equipo</option>${disp.map(e=>`<option value="${e.id}">${escapeHtml(e.nombre)}</option>`).join('')}</select>
          </div>
          <button class="btn btn-primary btn-block" onclick="agregarPartido()">Agregar partido</button>
        </div>` : `
        <div class="card card-admin"><p class="help" style="margin:0;">✅ Ya no quedan equipos para armar más partidos en esta fecha.${disp.length===1?' El equipo que sobra queda libre.':''}</p></div>`;
      contenido += form + `<button class="btn btn-danger btn-block" onclick="eliminarFecha()">🗑️ Eliminar esta fecha</button>`;
    }
  }

  return `
    <div class="fecha-row">${chips}</div>
    ${editar ? `<button class="btn btn-outline" style="margin-bottom:16px;" onclick="nuevaFecha()">➕ Nueva fecha</button>` : ''}
    ${contenido}`;
}

function renderMatchCard(p, c, editar){
  const local = c.equipos.find(e=>e.id===p.localId) || { nombre:'—', escudo:null };
  const visit = c.equipos.find(e=>e.id===p.visitanteId) || { nombre:'—', escudo:null };
  const crest = (e)=> e.escudo ? `<img class="crest-md" src="${e.escudo}" alt="">` : `<div class="crest-md-ph">🛡️</div>`;
  const marcador = p.jugado
    ? `<div class="score-box"><span class="score-num">${p.golesLocal}</span><span class="vs-label">—</span><span class="score-num">${p.golesVisitante}</span></div>`
    : `<div class="pendiente-label">VS · A jugarse</div>`;

  let adminBlock = '';
  if(editar){
    adminBlock = `
      <div class="match-admin-row">
        <div class="score-editor">
          <button class="step-btn" onclick="stepScore('${p.id}','gl',-1)">−</button>
          <input class="step-input" type="number" min="0" id="gl-${p.id}" value="${p.golesLocal}">
          <button class="step-btn" onclick="stepScore('${p.id}','gl',1)">+</button>
          <span class="vs-label" style="margin:0 6px;">—</span>
          <button class="step-btn" onclick="stepScore('${p.id}','gv',-1)">−</button>
          <input class="step-input" type="number" min="0" id="gv-${p.id}" value="${p.golesVisitante}">
          <button class="step-btn" onclick="stepScore('${p.id}','gv',1)">+</button>
        </div>
        <label class="jugado-check"><input type="checkbox" id="jg-${p.id}" ${p.jugado?'checked':''}> Ya se jugó</label>
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-gold" onclick="guardarResultado('${p.id}')">Guardar</button>
        <button class="btn btn-danger" onclick="eliminarPartido('${p.id}')">Eliminar</button>
      </div>`;
  }
  return `
    <div class="match-card">
      <div class="match-teams">
        <div class="match-team">${crest(local)}<div class="match-team-name">${escapeHtml(local.nombre)}</div></div>
        <div>${marcador}</div>
        <div class="match-team">${crest(visit)}<div class="match-team-name">${escapeHtml(visit.nombre)}</div></div>
      </div>
      ${adminBlock}
    </div>`;
}

function renderEquiposHTML(){
  const c = getCache();
  const torneo = TORNEOS[state.torneoId];
  const logo = state.logos[torneo.id];
  const filas = c.equipos.map(e=>`
    <div class="equipo-row">
      ${e.escudo ? `<img class="crest-md-sm" src="${e.escudo}" alt="">` : `<div class="crest-sm-ph" style="width:40px;height:40px;">🛡️</div>`}
      <div class="nombre">${escapeHtml(e.nombre)}</div>
      <button class="btn btn-outline" style="padding:8px 12px;min-height:40px;" onclick="renombrarEquipo('${e.id}')">✏️ Nombre</button>
      <label class="file-btn" style="width:auto;padding:8px 12px;">📷 Escudo
        <input type="file" accept="image/*" onchange="onEscudoEquipoChange('${e.id}', this)">
      </label>
      <button class="btn btn-danger" style="padding:8px 12px;min-height:40px;" onclick="eliminarEquipo('${e.id}')">🗑️ Borrar</button>
    </div>`).join('');

  return `
    <div class="card card-admin">
      <div class="card-title">➕ Agregar equipo nuevo</div>
      <div class="field">
        <label for="nuevoEquipoNombre">Nombre del equipo</label>
        <input type="text" id="nuevoEquipoNombre" placeholder="Ej: Los Amigos FC">
      </div>
      <button class="btn btn-primary btn-block" onclick="addEquipo()">Agregar equipo</button>
    </div>
    <div class="card">
      <div class="card-title">🛡️ Equipos de esta zona (${c.equipos.length})</div>
      ${filas || '<p class="empty-note">Todavía no hay equipos.</p>'}
    </div>
    <div class="card card-admin">
      <div class="card-title">🏆 Logo del torneo</div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;">
        <div class="crest-slot" style="width:56px;height:56px;">${logo?`<img src="${logo}" alt="">`:'🏆'}</div>
        <span style="color:#6b6659;font-size:.9rem;">Se muestra en la portada y en la tabla descargable.</span>
      </div>
      <label class="file-btn">📷 Cambiar logo del torneo
        <input type="file" accept="image/*" onchange="onLogoTorneoChange(this)">
      </label>
    </div>`;
}

/* =======================================================================
   DISPATCHER
   ======================================================================= */
function render(){
  const app = document.getElementById('app');
  if(state.errorCarga){
    app.innerHTML = `${renderTopbar('Torneos Adila', false)}<div class="wrap"><p class="loader-note">No se pudo conectar con los datos.<br>Revisá tu conexión a internet.</p><button class="btn btn-primary btn-block" onclick="location.reload()">Reintentar</button></div>`;
    return;
  }
  if(state.cargando){
    app.innerHTML = `${renderTopbar('Torneos Adila', false)}<div class="wrap"><p class="loader-note">Cargando…</p></div>`;
    return;
  }
  if(state.view==='home') renderHome();
  else if(state.view==='zonaSelect') renderZonaSelect();
  else if(state.view==='torneo') renderTorneoView();
  else if(state.view==='historial') renderHistorial();
  else if(state.view==='adminTorneo') renderAdminTorneo();
  renderToast();
}

/* =======================================================================
   INICIO
   ======================================================================= */
(async function init(){
  render();
  try{
    await loadEdiciones();
  }catch(e){
    console.error(e);
    state.errorCarga = true; state.cargando = false; render(); return;
  }
  state.edicionId = ultimaEdicion().id;
  state.cargando = false;
  render();
  try{
    const [lv, lm] = await Promise.all([getLogo('veteranos50'), getLogo('masCuarenta')]);
    state.logos.veteranos50 = lv; state.logos.masCuarenta = lm;
  }catch(e){}
  await loadCampeones();
  render();
})();
</script>
</body>
